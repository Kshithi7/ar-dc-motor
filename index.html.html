<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR DC Motor Demo</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: -apple-system, Helvetica, Arial, sans-serif; }

    #overlay {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 999;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      pointer-events: none;
    }
    #overlay button {
      pointer-events: auto;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 24px;
      background: #2E86AB;
      color: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    #overlay button:active { background: #236a86; }

    #info {
      position: fixed;
      top: 16px; left: 16px; right: 16px;
      z-index: 999;
      background: rgba(0,0,0,0.65);
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
    }

    #part-label {
      position: fixed;
      top: 70px; left: 0; right: 0;
      z-index: 999;
      text-align: center;
      pointer-events: none;
    }
    #part-label span {
      display: inline-block;
      background: rgba(242,140,40,0.92);
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      max-width: 80%;
    }
  </style>
</head>
<body>

  <div id="info">Point your camera at a printed <b>Hiro marker</b> to see the motor model. Tap a part to learn what it does.</div>
  <div id="part-label"></div>

  <div id="overlay">
    <button onclick="explode()">Explode</button>
    <button onclick="assemble()">Assemble</button>
    <button onclick="quiz()">Quiz</button>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">

    <a-assets></a-assets>

    <a-marker type="pattern" preset="hiro" id="marker">

      <a-entity id="motor" position="0 0 0">

        <!-- Casing -->
        <a-cylinder id="part-casing"
          class="part"
          data-name="Casing"
          data-info="Protects internal components and houses the stator magnets."
          radius="0.5" height="1" color="#8899A6"
          position="0 0.5 0" rotation="0 0 90" opacity="0.55"
          data-orig="0 0.5 0" data-explode="-1.4 0.5 0">
        </a-cylinder>

        <!-- Stator magnets -->
        <a-box id="part-magnet1"
          class="part"
          data-name="Stator Magnet"
          data-info="Creates the fixed magnetic field the rotor pushes against."
          width="0.15" height="0.7" depth="0.4" color="#D64545"
          position="0.35 0.5 0"
          data-orig="0.35 0.5 0" data-explode="-0.6 1.6 0">
        </a-box>
        <a-box id="part-magnet2"
          class="part"
          data-name="Stator Magnet"
          data-info="Creates the fixed magnetic field the rotor pushes against."
          width="0.15" height="0.7" depth="0.4" color="#D64545"
          position="-0.35 0.5 0"
          data-orig="-0.35 0.5 0" data-explode="-0.6 -0.6 0">
        </a-box>

        <!-- Armature / rotor -->
        <a-cylinder id="part-armature"
          class="part"
          data-name="Armature (Rotor)"
          data-info="Spins inside the magnetic field; current through its coil generates the rotating force."
          radius="0.18" height="0.7" color="#2E86AB"
          position="0 0.5 0" rotation="0 0 90"
          data-orig="0 0.5 0" data-explode="0.5 0.5 0">
        </a-cylinder>

        <!-- Commutator -->
        <a-cylinder id="part-commutator"
          class="part"
          data-name="Commutator"
          data-info="Reverses current direction each half-turn, keeping the rotor spinning continuously."
          radius="0.1" height="0.15" color="#F2A007"
          position="0.42 0.5 0" rotation="0 0 90"
          data-orig="0.42 0.5 0" data-explode="1.4 1.4 0">
        </a-cylinder>

        <!-- Brushes -->
        <a-box id="part-brush1"
          class="part"
          data-name="Brush"
          data-info="Carries current from the power source into the spinning commutator."
          width="0.06" height="0.06" depth="0.2" color="#333333"
          position="0.5 0.6 0.1"
          data-orig="0.5 0.6 0.1" data-explode="1.4 0.5 0.6">
        </a-box>
        <a-box id="part-brush2"
          class="part"
          data-name="Brush"
          data-info="Carries current from the power source into the spinning commutator."
          width="0.06" height="0.06" depth="0.2" color="#333333"
          position="0.5 0.4 -0.1"
          data-orig="0.5 0.4 -0.1" data-explode="1.4 -0.4 -0.6">
        </a-box>

        <!-- Shaft -->
        <a-cylinder id="part-shaft"
          class="part"
          data-name="Shaft"
          data-info="Transfers the rotor's spin out of the motor to drive external machinery."
          radius="0.05" height="1.2" color="#CCCCCC"
          position="0 0.5 0" rotation="0 0 90"
          data-orig="0 0.5 0" data-explode="0 0.5 -1.6">
        </a-cylinder>

      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    let exploded = false;
    let quizMode = false;
    let quizIndex = 0;
    let quizScore = 0;
    const quizOrder = ["Commutator", "Stator Magnet", "Armature (Rotor)", "Brush", "Shaft"];

    function allParts() {
      return document.querySelectorAll(".part");
    }

    function setLabel(text) {
      document.getElementById("part-label").innerHTML = text ? `<span>${text}</span>` : "";
    }

    function explode() {
      exploded = true;
      quizMode = false;
      allParts().forEach(el => {
        const pos = el.getAttribute("data-explode");
        el.setAttribute("animation", `property: position; to: ${pos}; dur: 800; easing: easeInOutQuad`);
      });
      setLabel("Tap any part to learn what it does");
    }

    function assemble() {
      exploded = false;
      quizMode = false;
      allParts().forEach(el => {
        const pos = el.getAttribute("data-orig");
        el.setAttribute("animation", `property: position; to: ${pos}; dur: 800; easing: easeInOutQuad`);
      });
      setLabel("");
    }

    function quiz() {
      if (!exploded) explode();
      quizMode = true;
      quizIndex = 0;
      quizScore = 0;
      askQuestion();
    }

    function askQuestion() {
      if (quizIndex >= quizOrder.length) {
        setLabel(`Quiz complete! Score: ${quizScore} / ${quizOrder.length}`);
        quizMode = false;
        return;
      }
      setLabel(`Tap the: ${quizOrder[quizIndex]}`);
    }

    document.querySelectorAll(".part").forEach(el => {
      el.addEventListener("click", () => {
        const name = el.getAttribute("data-name");
        const info = el.getAttribute("data-info");

        if (quizMode) {
          if (name === quizOrder[quizIndex]) {
            quizScore++;
            setLabel("Correct! " + info);
          } else {
            setLabel("Not quite — that's the " + name + ". Try the next one.");
          }
          quizIndex++;
          setTimeout(askQuestion, 1400);
        } else {
          setLabel(`${name}: ${info}`);
        }
      });
    });
  </script>

</body>
</html>
